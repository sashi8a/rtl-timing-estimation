[project]
name = "rtl-timing-estimation"
version = "0.0.0"
description = "Research on register-level RTL timing estimation using open-source tools"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2,<3", "pandas>=2,<3", "pyarrow>=19", "networkx>=3,<4"]

[dependency-groups]
dev = ["pytest>=8", "jupyterlab>=4", "nbclient>=0.10", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtl_timing"]

[project.scripts]
rtl-timing = "rtl_timing.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
